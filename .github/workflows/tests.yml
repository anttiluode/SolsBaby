name: Mathematical and CLI checks

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests -v
      - run: python -m solsbaby benchmark --out runs/ci --fail-on-gate
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: solsbaby-${{ matrix.python }}
          path: runs/ci

  desktop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update -qq && sudo apt-get install -y xvfb python3-tk
      - run: python -m pip install -e .
      - run: xvfb-run -a python -m unittest discover -s tests -p test_gui.py -v
